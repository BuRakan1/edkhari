<script>

function fix(o){const d=defaults();((o.settings||{}).obligations||[]).forEach(x=>{if(!x.id)x.id="o_"+uid();});o.settings=Object.assign(d.settings,o.settings||{});o.settings.zakat=Object.assign(d.settings.zakat,(o.settings&&o.settings.zakat)||{});o.settings.bonus=Object.assign(d.settings.bonus,(o.settings&&o.settings.bonus)||{});["categories","funds","fundTx","expenses","incomes","trips","oblPaid","cycles"].forEach(k=>{if(!Array.isArray(o[k]))o[k]=d[k];});return o;}
const UIK="edkhari.ui";function uiGet(k,d){try{const o=JSON.parse(localStorage.getItem(UIK)||"{}");return k in o?o[k]:d;}catch(e){return d;}}
function uiSet(k,v){try{const o=JSON.parse(localStorage.getItem(UIK)||"{}");o[k]=v;localStorage.setItem(UIK,JSON.stringify(o));}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}}
function commit(){save();renderAll();}

function salaryFor(){return +D.settings.salary||0;}
function cycleList(){
  const cs=D.cycles.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  if(!cs.length){const d=new Date();let ym=ymNow();if(d.getDate()<15)ym=ymAdd(ym,-1);return [{id:"virtual",ym,date:ym+"-01",salary:salaryFor(),virtual:true}];}
  return cs;
}
function curIdx(cs){const t=todayISO();let i=0;cs.forEach((c,k)=>{if(c.date<=t)i=k;});return i;}
function rangeOf(cs,i){return [cs[i].date,i+1<cs.length?cs[i+1].date:"9999-12-31"];}
const inR=(d,r)=>d>=r[0]&&d<r[1];
const dayBefore=iso=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()-1);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
const oblTotal=()=>D.settings.obligations.filter(o=>!o.stopped).reduce((a,o)=>a+(+o.amount||0),0);

function fundEvents(fid){
  const ev=[];
  D.fundTx.filter(t=>t.fund===fid).forEach(t=>ev.push(t));
  D.expenses.filter(e=>e.fromFund===fid).forEach(e=>ev.push({id:e.id,fund:fid,type:"withdraw",date:e.date,amount:e.amount,note:"مصروف: "+(e.tripId?tripCat(e.tcat).name:catName(e.cat))+(e.note?" · "+e.note:""),fromExpense:true}));
  D.incomes.filter(i=>i.toFund===fid&&+i.toAmount>0).forEach(i=>ev.push({id:i.id,fund:fid,type:"deposit",date:i.date,amount:i.toAmount,note:"من "+i.name,fromIncome:true}));
  const ord={opening:0,deposit:1,withdraw:2,zakat:3};
  return ev.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(ord[a.type]-ord[b.type]));
}
function fundState(fid,asOf){
  asOf=asOf||todayISO();
  const r=(+D.settings.zakat.rate||0)/100;
  let lots=[];let bal=0;
  fundEvents(fid).forEach(t=>{
    if(t.date>asOf)return;
    const a=+t.amount||0;
    if(t.type==="opening"){lots.push({date:t.hawl||t.date,amt:a});bal+=a;}
    else if(t.type==="deposit"){lots.push({date:t.date,amt:a});bal+=a;}
    else if(t.type==="withdraw"||t.type==="zakat"){
      let left=a;bal-=a;
      for(const l of lots){if(left<=0)break;const take=Math.min(l.amt,left);l.amt-=take;left-=take;}
      if(t.type==="zakat"){lots.forEach(l=>{if(l.amt>0&&addYear(l.date)<=t.date)l.date=t.date;});}
    }
    lots=lots.filter(l=>l.amt>0.004);
  });
  let due=0,dueBase=0,next=null;
  lots.forEach(l=>{
    let n=0,d=l.date;while(addYear(d)<=asOf){n++;d=addYear(d);}
    if(n>0){due+=l.amt*(1-Math.pow(1-r,n));dueBase+=l.amt;}
    const nd=addYear(n>0?d:l.date);if(!next||nd<next)next=nd;
  });
  return {bal,lots,due,dueBase,next,reserve:bal*r};
}
function zakatSummary(){
  const zf=D.funds.filter(f=>f.zakat);
  const st=zf.map(f=>({f,s:fundState(f.id)}));
  const total=st.reduce((a,x)=>a+x.s.bal,0);
  const nisab=(+D.settings.zakat.goldPrice||0)*(+D.settings.zakat.nisabGrams||85);
  const reach=total>=nisab&&nisab>0;
  const due=reach?st.reduce((a,x)=>a+x.s.due,0):0;
  const reserve=reach?st.reduce((a,x)=>a+x.s.reserve,0):0;
  let next=null;st.forEach(x=>{if(x.s.next&&(!next||x.s.next<next))next=x.s.next;});
  return {st,total,nisab,reach,due,reserve,next};
}

function cycleData(cs,i){
  let carry=0,md=null;
  for(let k=0;k<=i;k++){md=monthData(cs[k],rangeOf(cs,k),carry);carry=D.settings.carryOn?md.remain:0;}
  if(i>0&&D.settings.carryOn)md.prevYm=cs[i-1].ym;
  return md;
}
function monthData(c,r,carry){carry=+carry||0;
  const salary=+c.salary||0;
  const dep=D.funds.map(f=>{
    const amt=D.fundTx.filter(t=>t.fund===f.id&&t.type==="deposit"&&t.src!=="other"&&inR(t.date,r)).reduce((a,t)=>a+(+t.amount||0),0);
    return {f,amt};
  });
  const depTotal=dep.reduce((a,d)=>a+d.amt,0);
  const paidL=D.oblPaid.filter(x=>x.cy===c.id);
  const obItems=D.settings.obligations.filter(o=>!o.stopped||o.stopped>=r[1]||paidL.some(x=>x.ob===o.id)).map(o=>{const p=paidL.find(x=>x.ob===o.id);return {o,p};});
  const obl=paidL.reduce((a,x)=>a+(+x.amount||0),0);
  const oblDue=obItems.filter(x=>!x.p).reduce((a,x)=>a+(+x.o.amount||0),0);
  const exp=D.expenses.filter(e=>inR(e.date,r)&&!e.fromFund&&(!e.tripId||(tripById(e.tripId)||{}).mode==="remain"));
  const expTotal=exp.reduce((a,e)=>a+(+e.amount||0),0);
  const inc=D.incomes.filter(i=>inR(i.date,r));
  const incSpend=inc.reduce((a,i)=>a+Math.max(0,(+i.amount||0)-(+i.toAmount||0)),0);
  const byCat={};exp.forEach(e=>{const k=e.tripId?"trip:"+e.tripId:(e.cat||"none");byCat[k]=(byCat[k]||0)+(+e.amount||0);});
  return {c,r,carry,salary,dep,depTotal,obl,oblDue,obItems,paidL,exp,expTotal,inc,incSpend,byCat,remain:carry+salary+incSpend-depTotal-obl-expTotal};
}
function catLabelKey(k){if(k.startsWith("trip:")){const t=tripById(k.slice(5));return {name:"سفر: "+(t?t.name:""),color:"#5c7cfa"};}if(k==="none")return {name:"بدون فئة",color:"#adb5bd"};const c=catById(k);return {name:c?c.name:"فئة محذوفة",color:c?c.color:"#adb5bd"};}

function donut(parts,size){
  const tot=parts.reduce((a,p)=>a+p.v,0);const R=60,W=18,C=2*Math.PI*R;
  if(tot<=0)return '<svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="'+R+'" fill="none" stroke="var(--fill)" stroke-width="'+W+'"/></svg>';
  let off=0,s="";
  parts.forEach(p=>{if(p.v<=0)return;const len=p.v/tot*C;s+='<circle cx="75" cy="75" r="'+R+'" fill="none" stroke="'+p.c+'" stroke-width="'+W+'" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 75 75)"/>';off+=len;});
  return '<svg viewBox="0 0 150 150" role="img" aria-label="توزيع الراتب">'+s+'</svg>';
}

function renderSpend(){

  const list=D.expenses.filter(e=>inR(e.date,r)).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  const used={};list.forEach(e=>{const k=e.tripId?"trip":(e.cat||"none");used[k]=(used[k]||0)+(+e.amount||0);});

function barChart(vals){

function lineChart(vals,labels){

function nf(id,label,val,step,path,money){return '<div class="fld"><label for="'+id+'">'+label+'</label><input id="'+id+'"'+(money?MI+'value="'+fmtIn(val)+'"':' type="number" inputmode="decimal" step="'+step+'" value="'+(val==null?"":val)+'"')+' data-set="'+(path||id)+'"></div>';}

function liveSetup(){const n=$("nisabVal");if(n)n.textContent=fmt((+D.settings.zakat.goldPrice||0)*(+D.settings.zakat.nisabGrams||0));const o=$("oblTot");if(o)o.textContent=fmt(oblTotal());}
function setPath(path,val){const p=path.split(".");let o=D.settings;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val;}
document.addEventListener("input",e=>{const t=e.target;if(t.classList&&t.classList.contains("money")){const d=toLat(t.value).replace(/[^0-9]/g,"").replace(/^0+(?=[0-9])/,"");t.value=d?(+d).toLocaleString("en-US"):"";}},true);
document.addEventListener("change",e=>{const t=e.target;if(t.tagName==="SELECT"&&t.dataset.list){t.dispatchEvent(new Event("input",{bubbles:true}));}});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.set){let v=t.type==="checkbox"?t.checked:t.classList.contains("money")?num(t):(t.type==="number"?(t.value===""?0:+t.value):t.value);setPath(t.dataset.set,v);save();if(t.type==="checkbox")renderSetup();liveSetup();renderHome();renderSave();return;}
  if(t.dataset.list){const arr=D.settings[t.dataset.list];const it=arr[+t.dataset.k];if(!it)return;const f=t.dataset.f;if(f==="sign"){it.amount=Math.abs(+it.amount||0)*(+t.value);}else if(t.classList.contains("money")){const neg=t.dataset.list==="changes"&&(+it.amount<0||(t.parentNode.querySelector("select")||{}).value==="-1");it[f]=num(t)*(neg?-1:1);}else it[f]=t.type==="number"?(+t.value||0):t.value;save();liveSetup();renderHome();if(saveSeg==="plan")renderSave();return;}
});
document.addEventListener("change",e=>{const t=e.target;
  if(t.type==="checkbox"&&t.dataset.set){setPath(t.dataset.set,t.checked);save();renderAll();}
  if(t.id==="bkFile"){const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>applyBackup(String(r.result));r.readAsText(f);t.value="";}
  if(t.id==="impFile"){const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{applyBackup(String(r.result));closeSheet();};r.readAsText(f);t.value="";}
});

function openSheet(html,mount){const o=$("sheetCard");const c=o.cloneNode(false);o.replaceWith(c);c.innerHTML='<div class="grab"></div>'+html;$("sheet").hidden=false;document.body.classList.add("lock");if(mount)mount(c);}
function closeSheet(){$("sheet").hidden=true;$("sheetCard").innerHTML="";document.body.classList.remove("lock");}
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheet").hidden)closeSheet();});
function shead(title,saveLabel){return '<div class="shead"><button type="button" data-x="close">إلغاء</button><h2>'+title+'</h2><button type="button" data-x="save">'+(saveLabel||"حفظ")+'</button></div>';}
function delBox(label){return '<div id="delBox" style="margin-top:16px"><button class="btn r full" type="button" data-x="del">'+label+'</button></div>';}
function armDelete(c,fn){const b=c.querySelector("#delBox");if(!b)return;b.addEventListener("click",e=>{const x=e.target.dataset.x;if(x==="del"){b.innerHTML='<div class="btns"><button class="btn rf" type="button" data-x="delyes">نعم، احذف</button><button class="btn" type="button" data-x="delno">تراجع</button></div>';}else if(x==="delyes"){fn();}else if(x==="delno"){b.innerHTML='<button class="btn r full" type="button" data-x="del">حذف</button>';}});}

function expenseSheet(e){
  const isNew=!e;const tr=activeTrip();
  e=e?clone(e):{id:uid(),date:todayISO(),amount:"",cat:"",sub:"",note:"",tripId:tr?tr.id:"",tcat:"food",nights:"",night:"",fromFund:""};
  let h=shead(isNew?"مصروف جديد":"تعديل مصروف");
  h+='<input class="amount money" id="x_amt"'+MI+'placeholder="0" value="'+fmtIn(e.amount)+'" aria-label="المبلغ"><div style="text-align:center;color:var(--ink2);margin-top:-4px">ريال</div>';
  const trips=D.trips.filter(t=>!t.end||t.id===e.tripId);
  if(trips.length)h+='<div class="gh">السفر</div><div class="group"><div class="fld"><label for="x_trip">على سفرة</label><select id="x_trip"><option value="">لا</option>'+trips.map(t=>'<option value="'+t.id+'"'+(e.tripId===t.id?' selected':'')+'>'+esc(t.name)+'</option>').join("")+'</select></div></div>';
  h+='<div id="x_tripbox"></div><div id="x_catbox"></div>';
  h+='<div class="gh">التفاصيل</div><div class="group"><div class="fld"><input class="name" id="x_note" type="text" placeholder="مثل اسم القطعة أو المحل (اختياري)" value="'+esc(e.note)+'" aria-label="التفاصيل"></div><div class="fld"><label for="x_date">التاريخ</label><input id="x_date" type="date" value="'+e.date+'"></div>'+
    (D.funds.length?'<div class="fld"><label for="x_fund">الدفع من</label><select id="x_fund"><option value="">الراتب (المتبقي)</option>'+D.funds.map(f=>'<option value="'+f.id+'"'+(e.fromFund===f.id?' selected':'')+'>'+esc(f.name)+'</option>').join("")+'</select></div>':'')+'</div>';
  h+='<p class="msg" id="x_msg" style="color:var(--red)"></p>';
  if(!isNew)h+=delBox("حذف المصروف");
  openSheet(h,c=>{
    const draw=()=>{
      const tid=c.querySelector("#x_trip")?c.querySelector("#x_trip").value:"";e.tripId=tid;
      if(tid){
        c.querySelector("#x_catbox").innerHTML="";
        let b='<div class="gh">نوع مصروف السفر</div><div class="chips">'+TRIPCATS.map(t=>'<button class="chip" type="button" data-tc="'+t.id+'" aria-pressed="'+(e.tcat===t.id)+'"><i class="dot" style="background:'+t.color+'"></i>'+t.name+'</button>').join("")+'</div>';
        if(e.tcat==="hotel")b+='<div class="group" style="margin-top:10px"><div class="fld"><label for="x_n">عدد الليالي</label><input id="x_n" type="number" inputmode="numeric" value="'+(e.nights||"")+'"></div><div class="fld"><label for="x_p">سعر الليلة</label><input id="x_p"'+MI+'value="'+fmtIn(e.night)+'"></div></div><p class="gf">المبلغ يُحسب تلقائياً: الليالي × سعر الليلة.</p>';
        c.querySelector("#x_tripbox").innerHTML=b;
      }else{
        c.querySelector("#x_tripbox").innerHTML="";
        const cat=catById(e.cat);
        let b='<div class="gh">الفئة (اختياري)</div><div class="chips">'+D.categories.map(k=>'<button class="chip" type="button" data-cat="'+k.id+'" aria-pressed="'+(e.cat===k.id)+'"><i class="dot" style="background:'+k.color+'"></i>'+esc(k.name)+'</button>').join("")+'</div>';
        if(cat&&cat.subs.length)b+='<div class="gh">النوع</div><div class="chips">'+cat.subs.map(s=>'<button class="chip" type="button" data-sub="'+esc(s)+'" aria-pressed="'+(e.sub===s)+'">'+esc(s)+'</button>').join("")+'</div>';
        c.querySelector("#x_catbox").innerHTML=b;
      }
    };
    draw();
    c.addEventListener("click",ev=>{
      const t=ev.target.closest("button");if(!t)return;
      if(t.dataset.cat!==undefined){e.cat=e.cat===t.dataset.cat?"":t.dataset.cat;e.sub="";draw();return;}
      if(t.dataset.sub!==undefined){e.sub=e.sub===t.dataset.sub?"":t.dataset.sub;draw();return;}
      if(t.dataset.tc){e.tcat=t.dataset.tc;draw();return;}
      if(t.dataset.x==="close"){closeSheet();return;}
      if(t.dataset.x==="save"){
        if(e.tripId&&e.tcat==="hotel"){const n=+(c.querySelector("#x_n")||{}).value||0,p=num(c.querySelector("#x_p"));e.nights=n;e.night=p;if(n&&p)c.querySelector("#x_amt").value=fmtIn(n*p);}
        const amt=num(c.querySelector("#x_amt"));
        if(!(amt>0)){c.querySelector("#x_msg").textContent="اكتب المبلغ.";c.querySelector("#x_amt").focus();return;}
        e.amount=amt;e.note=c.querySelector("#x_note").value.trim();e.date=c.querySelector("#x_date").value||todayISO();
        e.fromFund=c.querySelector("#x_fund")?c.querySelector("#x_fund").value:"";
        if(!e.tripId){e.tcat="";e.nights="";e.night="";}else{e.cat="";e.sub="";}
        const i=D.expenses.findIndex(x=>x.id===e.id);if(i>=0)D.expenses[i]=e;else D.expenses.push(e);
        closeSheet();commit();return;}
    });
    c.addEventListener("input",ev=>{if(ev.target.id==="x_n"||ev.target.id==="x_p"){const n=+c.querySelector("#x_n").value||0,p=num(c.querySelector("#x_p"));if(n&&p)c.querySelector("#x_amt").value=fmtIn(n*p);}});
    c.addEventListener("change",ev=>{if(ev.target.id==="x_trip")draw();});
    armDelete(c,()=>{D.expenses=D.expenses.filter(x=>x.id!==e.id);closeSheet();commit();});
    if(isNew)setTimeout(()=>c.querySelector("#x_amt").focus(),250);
  });
}

const backupText=()=>JSON.stringify({app:"edkhari",v:3,saved:new Date().toISOString(),data:D});

function bmsg(t,ok){const m=$("bkMsg");if(m){m.textContent=t;m.style.color=ok?"var(--green)":"var(--red)";}}
function applyBackup(txt){try{const o=JSON.parse(txt);const d=o&&o.data?o.data:o;if(!d||d.v!==3||!d.settings)throw 0;D=fix(d);save();renderAll();bmsg("تم استرجاع بياناتك.",true);}catch(e){bmsg("الملف أو النص غير صالح.",false);}}
async function doExport(){const txt=backupText(),name=backupName();
  try{const file=new File([txt],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"نسخة احتياطية - ادخاري"});bmsg("اختر «حفظ في الملفات» لو ما اخترته.",true);return;}}catch(e){if(e&&e.name==="AbortError")return;}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);bmsg("تم حفظ الملف "+name,true);}catch(e){bmsg("ما قدرت أحفظ الملف، استخدم «نسخ البيانات كنص».",false);}}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");if(!b||b.closest("#sheetCard"))return;
  const a=b.dataset.act,id=b.dataset.id,k=b.dataset.k;
  switch(a){
    case "hm":homeIdx=Math.max(0,Math.min(cycleList().length-1,homeIdx+(+k)));renderHome();break;
    case "sm":spendIdx=Math.max(0,Math.min(cycleList().length-1,spendIdx+(+k)));renderSpend();break;
    case "salary":salarySheet();break;
    case "spseg":spendSeg=k;renderSpend();break;
    case "yr":repYear+=(+k);renderSpend();break;
    case "togobl":uiSet("oblOpen",!uiGet("oblOpen",true));renderHome();break;
    case "editcycle":salarySheet(D.cycles.find(x=>x.id===id));break;
    case "sf":spendFilter=k;renderSpend();break;
    case "seg":saveSeg=k;renderSave();break;
    case "addexp":expenseSheet();break;
    case "editexp":expenseSheet(D.expenses.find(x=>x.id===id));break;
    case "addinc":incomeSheet();break;
    case "editinc":incomeSheet(D.incomes.find(x=>x.id===id));break;
    case "payzakat":zakatSheet();break;
    case "fund":fundSheet(fundById(id));break;
    case "addfund":fundSheet();break;
    case "dep":case "depx":case "wd":fundTxSheet(id,a);break;
    case "newtrip":tripSheet();break;
    case "edittrip":tripSheet(tripById(id));break;
    case "tripview":tripView(id);break;
    case "endtrip":{const t=tripById(id);if(t){t.end=todayISO();if(t.end<t.start)t.end=t.start;commit();}break;}
    case "cat":catSheet(catById(id));break;
    case "addcat":catSheet();break;
    case "oblpay":{const o=D.settings.obligations.find(x=>x.id===id);const cs=cycleList();const c=cs[homeIdx===null?curIdx(cs):homeIdx];if(o&&c){const isCur=(homeIdx===null||homeIdx===curIdx(cs));D.oblPaid.push({id:uid(),ob:o.id,name:o.name,cy:c.id,amount:+o.amount||0,date:isCur?todayISO():c.date});commit();}break;}
    case "oblundo":D.oblPaid=D.oblPaid.filter(x=>x.id!==id);commit();break;
    case "addobl":D.settings.obligations.push({id:"o_"+uid(),name:"",amount:0});commit();break;
    case "stopobl":{const o=D.settings.obligations[+k];if(o){o.stopped=todayISO();commit();}break;}
    case "startobl":{const o=D.settings.obligations[+k];if(o){delete o.stopped;commit();}break;}
    case "delobl":D.settings.obligations.splice(+k,1);commit();break;
    case "addchg":D.settings.changes.push({ym:ymAdd(ymNow(),1),amount:500});commit();break;
    case "delchg":D.settings.changes.splice(+k,1);commit();break;
    case "export":doExport();break;
    case "copy":(async()=>{const txt=backupText();try{await navigator.clipboard.writeText(txt);bmsg("تم النسخ. الصقه في الملاحظات.",true);}catch(e){const ta=$("bkText");ta.hidden=false;ta.value=txt;ta.select();bmsg("حدد النص وانسخه.",false);}})();break;
    case "paste":{const ta=$("bkText");if(ta.hidden||!ta.value.trim()){ta.hidden=false;ta.value="";ta.focus();bmsg("الصق النص ثم اضغط «استرجاع من نص» مرة ثانية.",true);}else applyBackup(ta.value.trim());break;}
    case "import":openSheet('<div class="shead"><button type="button" data-x="close">إغلاق</button><h2>استرجاع نسخة</h2><span></span></div><div class="group"><label class="add" for="impFile">اختر ملف النسخة الاحتياطية<input id="impFile" type="file" accept=".json,application/json,text/plain" hidden></label></div>',c=>c.addEventListener("click",e=>{if(e.target.dataset.x==="close")closeSheet();}));break;
    case "reset":$("resetBox").innerHTML='<div class="btns"><button class="btn rf" type="button" data-act="resetyes">نعم، احذف كل شي</button><button class="btn" type="button" data-act="resetno">تراجع</button></div>';break;
    case "resetno":renderSetup();break;
    case "resetyes":D=defaults();save();renderAll();break;
  }
});
$("fab").addEventListener("click",()=>{const v=location.hash.slice(1);if(v==="save")fundTxSheet();else if(v==="spend"||v==="trip")expenseSheet();else addChooser();});

const VIEWS=["home","spend","save","trip","setup"];
function route(){const v=VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):"home";VIEWS.forEach(x=>$("v-"+x).hidden=x!==v);document.querySelectorAll(".tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.t===v?"page":"false"));$("fab").setAttribute("aria-label",v==="save"?"إيداع ادخار":v==="home"||v===""?"إضافة":"إضافة مصروف");window.scrollTo(0,0);}
window.addEventListener("hashchange",route);
function renderAll(){renderHome();renderSpend();renderSave();renderTrip();renderSetup();}
renderAll();route();
let lastDay=todayISO();document.addEventListener("visibilitychange",()=>{if(!document.hidden&&todayISO()!==lastDay){lastDay=todayISO();homeIdx=null;spendIdx=null;renderAll();}});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude|anthropic/.test(location.hostname))window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
